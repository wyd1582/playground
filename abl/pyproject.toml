[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abl"
version = "0.1.0"
description = "Agentic Breeding-value Loop: a deterministic harness that judges any genomic-prediction method"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "genoframe*", "dsl*", "engine*", "gates*", "registry*", "agents*",
           "campaigns*", "sim*", "dataio*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests", "dashboard/tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
